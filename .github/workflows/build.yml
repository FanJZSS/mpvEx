name: CI/CD Build

on:
  pull_request:
  # Manual run from the Actions tab: additionally builds debug-signed APKs that
  # install directly on a phone, with no repository secrets required.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleStandardRelease

      - name: Upload app-arm64-v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-arm64-v8a-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release-unsigned.apk
          if-no-files-found: warn
      - name: Upload app-armeabi-v7a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-armeabi-v7a-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-armeabi-v7a-release-unsigned.apk
          if-no-files-found: warn
      - name: Upload app-universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-universal-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-universal-release-unsigned.apk
          if-no-files-found: warn
      - name: Upload app-x86 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-x86-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86-release-unsigned.apk
          if-no-files-found: warn
      - name: Upload app-x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-x86_64-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86_64-release-unsigned.apk
          if-no-files-found: warn

  # Debug-signed build, reachable from the "Run workflow" button.
  # Debug APKs are signed with the Gradle debug keystore that is generated on the
  # runner, so they install directly on a phone and need no repository secrets.
  build-debug:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew assembleStandardDebug

      - name: Locate debug APKs
        run: |
          set -e
          ls -lah app/build/outputs/apk/standard/debug

      - name: Collect APKs
        run: |
          set -e
          DEBUG_DIR="app/build/outputs/apk/standard/debug"
          mkdir -p output
          # Rename so the artifact name carries the commit, e.g.
          # app-standard-arm64-v8a-debug.apk -> mpvEx-debug-arm64-v8a-abc1234.apk
          for apk in $(find "$DEBUG_DIR" -maxdepth 1 -name "*.apk" -type f); do
            name=$(basename "$apk")
            abi=$(echo "$name" | sed -E 's/^app-standard-(.*)-debug\.apk$/\1/')
            cp "$apk" "output/mpvEx-debug-${abi}-${SHORT_SHA}.apk"
          done
          ls -lah output

      # Debug APKs are already signed by Gradle with the standard debug key
      # (~/.android/debug.keystore, store/key password "android"). Re-signing with
      # the same key + apksigner just normalises the output so every artifact in
      # this upload is definitely installable.
      - name: Re-sign debug APKs with the debug key
        run: |
          set -e
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p signed
          for apk in output/mpvEx-debug-*.apk; do
            base=$(basename "$apk" .apk)
            "$APKSIGNER" sign \
              --ks "$DEBUG_KEYSTORE" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "signed/${base}.apk" \
              "$apk"
            "$APKSIGNER" verify --verbose "signed/${base}.apk"
          done
          rm -rf output
          mv signed output
          ls -lah output

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-debug-${{ env.SHORT_SHA }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
